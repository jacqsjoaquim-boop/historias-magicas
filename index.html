<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="theme-color" content="#3A1466" />
    <title>Histórias Mágicas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap;font-size:14px;">ERRO: ' + msg + '\nLinha: ' + line + '\n' + (error && error.stack ? error.stack : '') + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<pre style="color:red;padding:20px;white-space:pre-wrap;font-size:14px;">ERRO (promise): ' + e.reason + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
